
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "${API_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-amanpay_db}

      DB_SYNC: ${DB_SYNC:-false}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}

      ACCESS_TOKEN_EXPIRES: ${ACCESS_TOKEN_EXPIRES:-15m}
      REFRESH_TOKEN_EXPIRES: ${REFRESH_TOKEN_EXPIRES:-7d}
      PASSWORD_RESET_TOKEN_EXPIRES: ${PASSWORD_RESET_TOKEN_EXPIRES:-30m}

      SEED_DEFAULT_ADMIN: ${SEED_DEFAULT_ADMIN:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-8-chars-min}

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-amanpay_db}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-amanpay_db}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: